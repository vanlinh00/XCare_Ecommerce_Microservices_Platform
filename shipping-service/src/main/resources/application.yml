server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: shipping-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shipping_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: XCare-Shipping-HikariPool
      maximum-pool-size: 15
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
    consumer:
      group-id: xcare-shipping-cancellation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:xcare_redis_secret}
      timeout: 5000ms

xcare:
  topics:
    order-cancellation: order-cancellation-events
    shipping-cancellation: shipping-cancellation-events
  carriers:
    ahamove:
      api-url: https://api.ahamove.com/v1
      api-key: mock_ahamove_key_pharmacy_express
    ghtk:
      api-url: https://services.giaohangtietkiem.vn/services/shipment/order
      api-token: mock_ghtk_token_express

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
